<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Prova CPW2 - Questões 3 e 4</title>
</head>
<body>

    <!-- QUESTÃO 3: FORMULÁRIO DE CADASTRO -->
    <h2>Questão 3 - Formulário de Cadastro</h2>
    <form id="formCadastro">
        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" required>

        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" minlength="5" pattern="[A-ZÀ-Ú ]+" required>

        <label for="idade">Idade:</label>
        <input type="number" id="idade" min="18" max="99" required>

        <button type="submit">Enviar</button>
    </form>
    <div id="resultado"></div>

    <hr>

    <!-- QUESTÃO 4: FORMULÁRIO DO HERÓI -->
    <h2>Questão 4 - Formulário do Herói</h2>
    <form id="formHeroi">
        <label for="nomeHeroi">Nome do Herói:</label>
        <input type="text" id="nomeHeroi" minlength="3" maxlength="20" required>

        <label for="codigo">Código do Herói:</label>
        <input type="text" id="codigo" pattern="[A-Z]{3}-\d{3}" required>

        <label for="nivel">Nível:</label>
        <input type="number" id="nivel" min="1" max="100" required>

        <label for="cidade">Cidade do Herói:</label>
        <input type="text" id="cidade" pattern="[A-ZÀ-Ú ]+-[A-Z]{2}" required>

        <button type="submit">Enviar</button>
    </form>
    <div id="mensagem"></div>

    <script>
        // JavaScript da Questão 3
        const formCadastro = document.getElementById('formCadastro');
        const resultado = document.getElementById('resultado');

        formCadastro.addEventListener('submit', function(event) {
            event.preventDefault();

            const cpf = document.getElementById('cpf').value;
            const nome = document.getElementById('nome').value;
            const idade = document.getElementById('idade').value;

            resultado.innerHTML = `
                <p>Nome: ${nome}</p>
                <p>CPF: ${cpf}</p>
                <p>Idade: ${idade}</p>
            `;
        });

        // JavaScript da Questão 4
        const formHeroi = document.getElementById('formHeroi');
        const mensagem = document.getElementById('mensagem');

        formHeroi.addEventListener('submit', function(event) {
            event.preventDefault();

            const nomeHeroi = document.getElementById('nomeHeroi').value;
            const codigo = document.getElementById('codigo').value;
            const nivel = document.getElementById('nivel').value;
            const cidade = document.getElementById('cidade').value;

            mensagem.innerHTML = `<p>Herói ${nomeHeroi} (Código: ${codigo}) (Origem: ${cidade}) cadastrado com sucesso no Nível ${nivel}!</p>`;
        });
    </script>

</body>
</html>
