<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card do Herói</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="container">
    <section class="formulario">
        <h1>Criar Herói</h1>

        <form id="formHeroi">
            <label for="nome">Nome do Herói</label>
            <input type="text" id="nome" minlength="3" maxlength="20" required>
            <span class="erro" id="erroNome"></span>

            <label for="classe">Classe</label>
            <select id="classe" required>
                <option value="">Selecione uma classe</option>
                <option value="Guerreiro">Guerreiro</option>
                <option value="Mago">Mago</option>
                <option value="Arqueiro">Arqueiro</option>
                <option value="Curandeiro">Curandeiro</option>
            </select>

            <label for="nivel">Nível</label>
            <input type="number" id="nivel" min="1" max="100" required>

            <label for="email">E-mail do jogador</label>
            <input type="email" id="email" required>

            <label for="codigo">Código do Herói</label>
            <input type="text" id="codigo" pattern="[A-Z]{3}-[0-9]{3}" placeholder="ABC-123"
                   title="Digite no formato ABC-123" required>
            <span class="erro" id="erroCodigo"></span>

            <label for="senha">Senha</label>
            <input type="password" id="senha"
                   pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,}"
                   title="Mínimo de 8 caracteres, com maiúscula, minúscula e número"
                   required>
            <span class="erro" id="erroSenha"></span>

            <label for="cor">Cor do Card</label>
            <select id="cor" required>
                <option value="#2563eb">Azul</option>
                <option value="#16a34a">Verde</option>
                <option value="#dc2626">Vermelho</option>
                <option value="#9333ea">Roxo</option>
            </select>

            <button type="submit">PRÓXIMA ETAPA</button>
        </form>
    </section>

    <section class="card" id="cardHeroi">
        <h2 id="nomeCard">Nome do Herói</h2>
        <p>Classe: <span id="classeCard">-</span></p>
        <p>Nível: <span id="nivelCard">-</span></p>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
