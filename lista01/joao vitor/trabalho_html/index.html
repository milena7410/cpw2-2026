<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card do Herói</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Card do Herói</h1>

    <form id="formHeroi">
      <label for="nome">Nome do Herói</label>
      <input type="text" id="nome" name="nome" required minlength="3" maxlength="20">
      <span class="erro" id="erro-nome"></span>

      <label for="classe">Classe</label>
      <select id="classe" name="classe" required>
        <option value="">Selecione...</option>
        <option value="Guerreiro">Guerreiro</option>
        <option value="Mago">Mago</option>
        <option value="Arqueiro">Arqueiro</option>
        <option value="Curandeiro">Curandeiro</option>
      </select>

      <label for="nivel">Nível</label>
      <input type="number" id="nivel" name="nivel" min="1" max="100" required>

      <label for="email">E-mail do jogador</label>
      <input type="email" id="email" name="email" required>

      <label for="codigo">Código do Herói (ex.: ABC-123)</label>
      <input type="text" id="codigo" name="codigo" required pattern="[A-Z]{3}-[0-9]{3}">

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" required minlength="8"
             pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,}">
      <small class="dica">A senha deve ter no mínimo 8 caracteres, com pelo menos uma letra maiúscula, uma minúscula e um número.</small>

      <label for="cor">Cor do card</label>
      <select id="cor" name="cor">
        <option value="#3366cc">Azul</option>
        <option value="#c0392b">Vermelho</option>
        <option value="#2e8b57">Verde</option>
        <option value="#7d3c98">Roxo</option>
        <option value="#e67e22">Laranja</option>
      </select>

      <div class="botoes">
        <button type="button" id="btnCriar">CRIAR HERÓI</button>
        <button type="button" id="btnJson">SALVAR JSON</button>
        <button type="button" id="btnProxima">PRÓXIMA ETAPA</button>
      </div>
    </form>

    <p>JSON: <span id="jsonSaida"></span></p>

    <section class="card" id="card">
      <h2 id="cardNome">Nome do Herói</h2>
      <p>Classe: <span id="cardClasse">—</span></p>
      <p>Nível: <span id="cardNivel">—</span></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
